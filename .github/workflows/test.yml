name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test with race detector
        run: go test -race ./...
      - name: verify modules
        run: go mod verify
      - name: check tidy module files
        run: go mod tidy -diff
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...

  acceptance:
    name: acceptance (${{ matrix.cli }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - cli: terraform
            version: "1.10.0"
          - cli: terraform
            version: "1.17.2"
          - cli: opentofu
            version: "1.12.0"
          - cli: opentofu
            version: "1.13.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum
          cache: true
      - name: set up Terraform
        if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "${{ matrix.version }}"
          terraform_wrapper: false
      - name: set up OpenTofu
        if: matrix.cli == 'opentofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "${{ matrix.version }}"
          tofu_wrapper: false
      - name: acceptance tests
        env:
          TF_ACC: "1"
          TF_ACC_TERRAFORM_PATH: ${{ matrix.cli == 'opentofu' && 'tofu' || 'terraform' }}
        # Hermetic tests stub the Kubernetes API. Kind tests are excluded; they
        # need a real cluster and run in the acceptance-kind job.
        run: go test ./internal/provider -run TestAcc -skip TestAccKind -v -count=1

  acceptance-kind:
    name: acceptance kind (${{ matrix.cli }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - cli: terraform
            version: "1.10.0"
          - cli: opentofu
            version: "1.12.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum
          cache: true
      - name: set up Terraform
        if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "${{ matrix.version }}"
          terraform_wrapper: false
      - name: set up OpenTofu
        if: matrix.cli == 'opentofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "${{ matrix.version }}"
          tofu_wrapper: false
      - name: create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: kubeutil
          kubeconfig: ${{ github.workspace }}/kind.kubeconfig
          wait: 120s
      - name: deploy test workload
        env:
          KUBECONFIG: ${{ github.workspace }}/kind.kubeconfig
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: echo
            labels:
              app: echo
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: echo
            template:
              metadata:
                labels:
                  app: echo
              spec:
                containers:
                  - name: echo
                    image: nginx:1.27-alpine
                    ports:
                      - name: http
                        containerPort: 80
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: echo
            labels:
              app: echo
          spec:
            selector:
              app: echo
            ports:
              - name: http
                port: 80
                targetPort: http
          EOF
          kubectl rollout status deployment/echo --timeout=180s
          kubectl get pods -l app=echo -o wide
      - name: acceptance tests against kind
        env:
          TF_ACC: "1"
          TF_ACC_TERRAFORM_PATH: ${{ matrix.cli == 'opentofu' && 'tofu' || 'terraform' }}
          KUBEUTIL_KIND: "1"
          KUBECONFIG: ${{ github.workspace }}/kind.kubeconfig
        run: go test ./internal/provider -run TestAccKind -v -count=1
